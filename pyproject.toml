[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-for-computer-systems"
version = "0.1.0"
description = "A modular foundation for monitoring and simulating computer systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
"psutil>=5.9"
]

[tool.setuptools.packages.find]
where = ["src"]